name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # lo reutiliza el workflow de publicación antes de construir

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install PyQt6 evdev pyflakes
      - name: Lint
        run: python -m pyflakes main.py korvex packaging tests
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Build .deb (comprobación)
        run: bash build_deb.sh
